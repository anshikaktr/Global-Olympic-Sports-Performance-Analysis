<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Olympic Performance Analytics{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark site-nav">
  <div class="container">
    <a class="navbar-brand" href="{{ url_for('index') }}">OlympicsAnalytics</a>
    <div class="navbar-nav">
      <a class="nav-link" href="{{ url_for('index') }}">Home</a>
      <a class="nav-link" href="{{ url_for('dashboard') }}">Dashboards</a>
      <a class="nav-link" href="{{ url_for('story') }}">Story</a>
    </div>
  </div>
</nav>
{% block content %}{% endblock %}
<footer class="text-center py-4 small text-muted">Global Olympic Sports Performance Analysis</footer>
<script type="module" src="https://public.tableau.com/javascripts/api/tableau.embedding.3.latest.min.js"></script>
</body>
</html>
